[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tri9cog"
version = "0.1.0"
description = "Triadic Cognitive Space: a formalized ternary (3^9=19683) coordinate system for mapping, fingerprinting, and regenerating literary structure."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "RUNZEAI", email = "q1z2q3@gmail.com" },
]
keywords = ["narratology", "digital-humanities", "computational-literature", "ternary", "cognitive-science", "literary-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
tri9cog = "tri9cog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]